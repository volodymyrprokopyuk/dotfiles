[main]
font=JetBrains Mono Light:size=14,monospace:size=14
use-bold=yes
terminal=ghostty -e {cmd}
lines=18
width=56
horizontal-pad=12
vertical-pad=8

[colors]
background=070722ee
text=f3edf7ff
message=7c80b4ff
prompt=fff59bff
placeholder=7c80b4ff
input=f3edf7ff
match=fff59bff
selection=2a2a5eff
selection-text=f3edf7ff
selection-match=fff59bff
counter=7c80b4ff
border=21215fff

[border]
width=1
radius=10
selection-radius=4
