[main]
terminal=ghostty -e {cmd}

match-mode=fzf
sort-result=yes

keyboard-focus=on-demand
exit-on-keyboard-focus-loss=no

font=JetBrains Mono ExtraLight:size=14,monospace:size=14
use-bold=yes

lines=18
width=64

horizontal-pad=12
vertical-pad=8

[key-bindings]
next-with-wrap=Mod1+m
prev-with-wrap=Mod1+comma

[colors]
background=070722ee
text=f3edf7ff
message=7c80b4ff
prompt=fff59bff
placeholder=7c80b4ff
input=f3edf7ff
match=fff59bff
selection=2a2a5eff
selection-text=f3edf7ff
selection-match=fff59bff
counter=7c80b4ff
border=21215fff

[border]
width=2
radius=10
selection-radius=4
