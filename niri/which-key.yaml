# Theme
font: JetBrains Mono ExtraLight 13
background: "#070722ee"
color: "#f3edf7"
border: "#fff59b"
separator: " → "
border_width: 1
corner_r: 8
padding: 16
rows_per_column: 24
column_padding: 28

# Multi-layout key bindings
auto_kbd_layout: true
menu:
  # Keyboard layouts > niri msg keyboard-layouts
  - key: e
    desc: Keyboard English
    cmd: niri msg action switch-layout 0
  - key: s
    desc: Keyboard Spanish
    cmd: niri msg action switch-layout 1
  - key: u
    desc: Keyboard Ukrainian
    cmd: niri msg action switch-layout 2
  - key: r
    desc: Keyboard Russian
    cmd: niri msg action switch-layout 3
  # Monitors > niri msg outputs
  - key: "]"
    desc: Monitor rotate clockwise
    cmd: niri msg output HDMI-A-1 transform 270
  - key: "["
    desc: Monitor rotate counter-clockwise
    cmd: niri msg output HDMI-A-1 transform 90
  - key: "="
    desc: Monitor normal orientation
    cmd: niri msg output HDMI-A-1 transform normal
